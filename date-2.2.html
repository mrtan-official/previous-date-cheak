<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tanim Date Check Tool</title>
  <style>
    :root {
      font-family: 'Poppins', Arial, sans-serif;
    }

    body {
      background: #000;
      color: #0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }

    .container {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #0ff;
      box-shadow: 0 0 15px #0ff;
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h2 {
      color: #00fff7;
      font-size: 22px;
      text-shadow: 0 0 10px #00fff7;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      text-align: left;
      color: #0ff;
    }

    input[type=text], input[type=number] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #00fff7;
      background: #000;
      color: #0ff;
      font-size: 15px;
      margin-bottom: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      box-shadow: 0 0 12px #00fff7, 0 0 6px #00fff7;
    }

    button {
      background: #00fff7;
      color: #000;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      background: #0ff;
      box-shadow: 0 0 10px #00fff7;
    }

    button.clicked {
      box-shadow: 0 0 15px #00fff7, 0 0 25px #00fff7;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      background: #0a0a0a;
      border: 1px solid #00fff7;
      box-shadow: 0 0 10px #00fff7;
      font-size: 17px;
      color: #fff;
      line-height: 1.6;
    }

    .highlight {
      color: #0ff;
      font-weight: bold;
    }

    .error {
      color: #ff4444;
      font-weight: bold;
      margin-top: 10px;
    }

    footer {
      margin-top: 25px;
      font-size: 13px;
      color: #fff;
      text-align: center;
    }

    footer strong {
      color: #ff0;
      text-shadow: 0 0 5px #ff0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Tanim Date Check Tool</h2>

    <label for="dateInput">📅 Enter Date (DD-MM-YYYY):</label>
    <input type="text" id="dateInput" placeholder="e.g. 19-10-2005">

    <label for="daysBack">⏪ Days to go back:</label>
    <input type="number" id="daysBack" placeholder="e.g. 8">

    <button id="calcBtn" onclick="calculateDate()">Calculate</button>

    <div id="result"></div>

    <footer>
      ✨ Created by: <strong>Tanim-BPY0241</strong>
    </footer>
  </div>

  <script>
    function calculateDate() {
      const dateStr = document.getElementById('dateInput').value.trim();
      const daysBack = parseInt(document.getElementById('daysBack').value);
      const resultBox = document.getElementById('result');
      const button = document.getElementById('calcBtn');

      const datePattern = /^(\d{1,2})-(\d{1,2})-(\d{4})$/;
      const match = dateStr.match(datePattern);

      if (!match || isNaN(daysBack)) {
        resultBox.innerHTML = `<div class='error'>⚠️ Please enter a valid date (DD-MM-YYYY) and days.</div>`;
        return;
      }

      const day = parseInt(match[1]);
      const month = parseInt(match[2]);
      const year = parseInt(match[3]);

      const inputDate = new Date(year, month - 1, day);

      // Validate correct date
      if (
        inputDate.getDate() !== day ||
        inputDate.getMonth() !== month - 1 ||
        inputDate.getFullYear() !== year
      ) {
        resultBox.innerHTML = `<div class='error'>❌ Invalid date. Please check the format and values.</div>`;
        return;
      }

      inputDate.setDate(inputDate.getDate() - daysBack);

      const newDay = inputDate.getDate();
      const newMonth = inputDate.getMonth() + 1;
      const newYear = inputDate.getFullYear();

      // Button glow
      button.classList.add("clicked");
      setTimeout(() => {
        button.classList.remove("clicked");
      }, 300);

      resultBox.innerHTML = `
        <div><span class="highlight">🕒 New Date:</span></div>
        <div><span class="highlight">Day:</span> ${newDay}</div>
        <div><span class="highlight">Month:</span> ${newMonth}</div>
        <div><span class="highlight">Year:</span> ${newYear}</div>
      `;
    }
  </script>
</body>
</html>
