<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Previous Date Count Tool</title>
  <style>
    :root {
      font-family: 'Poppins', Arial, sans-serif;
    }

    body {
      background: #000;
      color: #0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }

    /* 🌌 Unique Cyber Background Animation */
    body::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 25% 25%, rgba(0,255,255,0.1) 0%, transparent 60%),
        radial-gradient(circle at 75% 75%, rgba(255,0,255,0.1) 0%, transparent 60%),
        radial-gradient(circle at 50% 50%, rgba(0,255,128,0.1) 0%, transparent 70%);
      animation: cyberWave 15s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes cyberWave {
      0% { transform: rotate(0deg) scale(1); filter: hue-rotate(0deg); }
      50% { transform: rotate(20deg) scale(1.05); filter: hue-rotate(120deg); }
      100% { transform: rotate(-20deg) scale(1); filter: hue-rotate(240deg); }
    }

    /* Floating Particle Grid Effect */
    body::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridFloat 18s linear infinite;
      z-index: 0;
    }

    @keyframes gridFloat {
      0% { transform: translate(0, 0); }
      50% { transform: translate(30px, 30px); }
      100% { transform: translate(0, 0); }
    }

    .container {
      background: rgba(17, 17, 17, 0.9);
      padding: 30px;
      border-radius: 15px;
      border: 1px solid #0ff;
      box-shadow: 0 0 20px #00fff7, inset 0 0 20px rgba(0,255,255,0.1);
      width: 100%;
      max-width: 600px;
      text-align: center;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(6px);
    }

    h2 {
      color: #00fff7;
      font-size: 24px;
      text-shadow: 0 0 15px #00fff7, 0 0 25px #00ccff;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      text-align: left;
      color: #0ff;
    }

    input[type=text], input[type=number] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #00fff7;
      background: #000;
      color: #0ff;
      font-size: 15px;
      margin-bottom: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      box-shadow: 0 0 12px #00fff7, 0 0 6px #00fff7;
    }

    button {
      background: #00fff7;
      color: #000;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
    }

    button:hover {
      background: #0ff;
      box-shadow: 0 0 20px #00fff7;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button.clicked {
      animation: buttonPulse 0.6s ease;
    }

    @keyframes buttonPulse {
      0%, 100% { box-shadow: 0 0 10px #00fff7; }
      50% { box-shadow: 0 0 30px #00fff7, 0 0 50px #00fff7; transform: scale(1.05); }
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      background: #0a0a0a;
      border: 1px solid #00fff7;
      box-shadow: 0 0 10px #00fff7;
      font-size: 17px;
      color: #fff;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
    }

    #result.show {
      opacity: 1;
      transform: translateY(0);
    }

    .highlight {
      color: #0ff;
      font-weight: bold;
    }

    .error {
      color: #ff4444;
      font-weight: bold;
      margin-top: 10px;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    footer {
      margin-top: 25px;
      font-size: 13px;
      color: #fff;
      text-align: center;
    }

    @keyframes borderPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(0,255,255,0.6); }
      50% { box-shadow: 0 0 25px rgba(0,255,255,0.9), 0 0 35px rgba(255,0,255,0.4); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Previous Date Count Tool</h2>

    <label for="dateInput">📅 Enter Date (DD-MM-YYYY):</label>
    <input type="text" id="dateInput" placeholder="e.g. 19-10-1890">

    <label for="daysBack">⏪ Days to go back:</label>
    <input type="number" id="daysBack" placeholder="e.g. 8">

    <button id="calcBtn" onclick="calculateDate()">Calculate</button>

    <div id="result"></div>

    <!-- ⚡ Neon Footer -->
    <footer>
      <div style="display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap;">
        <div style="
          width: 60px;
          height: 60px;
          border-radius: 50%;
          background: radial-gradient(circle at center, #00fff7 0%, #001010 80%);
          padding: 2px;
          box-shadow: 0 0 20px #00fff7, 0 0 40px #00ffbb inset;
          animation: borderPulse 3s ease-in-out infinite alternate;">
          <div style="
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 2px solid rgba(0,255,247,0.5);">
            <img src="https://i.postimg.cc/1zkqjC1k/mrtan.png" 
                 alt="Developer" 
                 style="width: 54px; height: 54px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 12px #00fff7;">
          </div>
        </div>

        <div style="text-align: left;">
          <div style="color: #00fff7; font-weight: bold; font-size: 15px; text-shadow: 0 0 8px rgba(0, 255, 255, 0.8); letter-spacing: 0.5px;">Mr. Tan</div>
          <div style="color: #bbb; font-size: 11px; margin-top: 2px;">💀 Cyber Developer</div>
          <div style="margin-top: 5px;">
            <a href="https://github.com/mrtan-official" target="_blank" 
               style="color:#00ffbb; text-decoration:none; font-weight:bold; font-size: 12px; text-shadow: 0 0 6px #00fff7;">
              🐙 GitHub: mrtan-official
            </a>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script>
    function calculateDate() {
      const dateStr = document.getElementById('dateInput').value.trim();
      const daysBack = parseInt(document.getElementById('daysBack').value);
      const resultBox = document.getElementById('result');
      const button = document.getElementById('calcBtn');

      const datePattern = /^(\d{1,2})-(\d{1,2})-(\d{4})$/;
      const match = dateStr.match(datePattern);

      if (!match || isNaN(daysBack)) {
        resultBox.innerHTML = `<div class='error'>⚠️ Invalid input! Please enter date in DD-MM-YYYY format and a valid number of days.</div>`;
        resultBox.classList.add('show');
        return;
      }

      const day = parseInt(match[1]);
      const month = parseInt(match[2]);
      const year = parseInt(match[3]);

      const inputDate = new Date(year, month - 1, day);

      if (inputDate.getDate() !== day || inputDate.getMonth() !== month - 1 || inputDate.getFullYear() !== year) {
        resultBox.innerHTML = `<div class='error'>❌ Invalid date detected! Please verify your day, month, and year values are correct.</div>`;
        resultBox.classList.add('show');
        return;
      }

      inputDate.setDate(inputDate.getDate() - daysBack);

      const newDay = inputDate.getDate();
      const newMonth = inputDate.getMonth() + 1;
      const newYear = inputDate.getFullYear();

      button.classList.add("clicked");
      setTimeout(() => { button.classList.remove("clicked"); }, 600);

      resultBox.innerHTML = `
        <div><span class="highlight">🕒 New Date:</span></div>
        <div><span class="highlight">Day:</span> ${newDay}</div>
        <div><span class="highlight">Month:</span> ${newMonth}</div>
        <div><span class="highlight">Year:</span> ${newYear}</div>
      `;
      
      resultBox.classList.add('show');
    }
  </script>
</body>
</html>
