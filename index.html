<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeMaster Pro | Date Calculator</title>
  
  <!-- Favicon -->
  <link rel="icon" href="https://i.postimg.cc/1zkqjC1k/mrtan.png" type="image/png">
  
  <!-- Google Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    :root {
      --primary: #00f2fe;
      --primary-glow: rgba(0, 242, 254, 0.7);
      --secondary: #ff2a6d;
      --accent: #05d9e8;
      --success: #00ff9d;
      --warning: #ffd166;
      --error: #ff2a6d;
      --bg-dark: #01012b;
      --bg-card: #011627;
      --text: #ffffff;
      --text-secondary: #b8c1ec;
      --gradient-1: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --gradient-2: linear-gradient(135deg, #ff2a6d 0%, #ff8a00 100%);
      --gradient-3: linear-gradient(135deg, #05d9e8 0%, #00ff9d 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Cosmic Background */
    .cosmic-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -3;
      background: 
        radial-gradient(circle at 20% 80%, rgba(0, 242, 254, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 42, 109, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(5, 217, 232, 0.03) 0%, transparent 50%),
        linear-gradient(135deg, #01012b 0%, #011627 50%, #00072d 100%);
    }

    /* Simplified Nebula */
    .nebula {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      opacity: 0.2;
      filter: blur(15px);
    }

    .nebula-cloud {
      position: absolute;
      border-radius: 50%;
      background: var(--primary);
      animation: nebulaFloat 25s infinite ease-in-out;
    }

    .nebula-cloud:nth-child(1) {
      width: 150px;
      height: 150px;
      top: -30px;
      left: -30px;
      background: var(--primary);
      animation-duration: 30s;
    }

    .nebula-cloud:nth-child(2) {
      width: 120px;
      height: 120px;
      top: 60%;
      right: -20px;
      background: var(--secondary);
      animation-duration: 25s;
      animation-delay: 5s;
    }

    @keyframes nebulaFloat {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        opacity: 0.1;
      }
      50% {
        transform: translate(40px, -20px) rotate(180deg) scale(1.05);
        opacity: 0.2;
      }
    }

    /* Simplified Quantum Particles */
    .quantum-particles {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
    }

    .quantum-particle {
      position: absolute;
      width: 1px;
      height: 1px;
      background: var(--primary);
      border-radius: 50%;
      opacity: 0;
      animation: quantumAppear 6s infinite linear;
    }

    .quantum-particle:nth-child(odd) {
      background: var(--secondary);
    }

    @keyframes quantumAppear {
      0% {
        transform: translate(var(--startX), var(--startY)) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
        transform: translate(var(--startX), var(--startY)) scale(1);
      }
      90% {
        opacity: 0.7;
      }
      100% {
        transform: translate(var(--endX), var(--endY)) scale(0);
        opacity: 0;
      }
    }

    /* Simplified Holographic Grid */
    .holographic-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.03;
      background-image: 
        linear-gradient(rgba(0, 242, 254, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridScan 20s linear infinite;
    }

    @keyframes gridScan {
      0% {
        transform: translate(0, 0);
        opacity: 0.03;
      }
      50% {
        opacity: 0.05;
      }
      100% {
        transform: translate(40px, 40px);
        opacity: 0.03;
      }
    }

    /* Compact Container */
    .container {
      background: rgba(1, 22, 39, 0.9);
      padding: 25px;
      border-radius: 18px;
      border: 1px solid rgba(0, 242, 254, 0.2);
      box-shadow: 
        0 0 20px rgba(0, 242, 254, 0.1),
        0 0 40px rgba(255, 42, 109, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      width: 100%;
      max-width: 380px;
      text-align: center;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent), var(--primary));
      border-radius: 20px;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .container:hover::before {
      opacity: 0.2;
    }

    .container:hover {
      transform: translateY(-3px) scale(1.005);
      box-shadow: 
        0 0 25px rgba(0, 242, 254, 0.15),
        0 0 50px rgba(255, 42, 109, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 1px;
      background: var(--gradient-1);
      border-radius: 2px;
      box-shadow: 0 0 5px var(--primary);
    }

    .logo-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--gradient-1);
      filter: blur(12px);
      opacity: 0.4;
      animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.3;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.5;
      }
    }

    .header img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 
        0 0 15px var(--primary),
        0 0 30px rgba(0, 242, 254, 0.15);
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .header img:hover {
      transform: scale(1.03) rotate(2deg);
      box-shadow: 
        0 0 18px var(--primary),
        0 0 35px rgba(0, 242, 254, 0.2);
    }

    .header-content h1 {
      font-size: 24px;
      font-weight: 800;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
      margin-bottom: 6px;
      letter-spacing: 0.8px;
    }

    .header-content p {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: 0.4px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--text);
      font-weight: 600;
    }

    .input-label .material-icons {
      color: var(--primary);
      font-size: 18px;
    }

    .input-container {
      position: relative;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px 14px 45px;
      border-radius: 10px;
      border: 2px solid rgba(0, 242, 254, 0.15);
      background: rgba(0, 10, 20, 0.6);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .input-field:focus {
      border-color: var(--primary);
      background: rgba(0, 20, 40, 0.7);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
      transform: translateY(-1px);
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-size: 18px;
      transition: all 0.3s ease;
    }

    .input-field:focus + .input-icon {
      color: var(--accent);
      transform: translateY(-50%) scale(1.05);
    }

    .hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      font-style: italic;
    }

    .calculate-btn {
      background: var(--gradient-1);
      color: #000;
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      width: 100%;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .calculate-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: 0.5s;
    }

    .calculate-btn:hover::before {
      left: 100%;
    }

    .calculate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 5px 15px rgba(0, 242, 254, 0.3),
        0 0 20px rgba(0, 242, 254, 0.15);
    }

    .calculate-btn:active {
      transform: translateY(-1px);
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: rgba(0, 10, 20, 0.6);
      border: 1px solid rgba(0, 242, 254, 0.15);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.05);
      font-size: 16px;
      color: var(--text);
      line-height: 1.5;
      opacity: 0;
      transform: translateY(15px) scale(0.95);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    #result.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: resultReveal 0.5s ease-out;
    }

    @keyframes resultReveal {
      0% {
        opacity: 0;
        transform: translateY(15px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .result-title {
      font-size: 18px;
      margin-bottom: 15px;
      color: var(--primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 15px;
    }

    .result-card {
      background: rgba(0, 242, 254, 0.08);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid rgba(0, 242, 254, 0.15);
      transition: all 0.3s ease;
    }

    .result-card:hover {
      background: rgba(0, 242, 254, 0.12);
      transform: translateY(-1px);
      border-color: rgba(0, 242, 254, 0.2);
    }

    .result-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .result-value {
      font-size: 20px;
      color: var(--primary);
      font-weight: 700;
    }

    .final-date {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: var(--gradient-1);
      color: #000;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      animation: dateGlow 2s ease-in-out infinite alternate;
    }

    @keyframes dateGlow {
      from {
        box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
      }
      to {
        box-shadow: 0 0 18px rgba(0, 242, 254, 0.4), 0 0 25px rgba(0, 242, 254, 0.2);
      }
    }

    .error {
      color: var(--error);
      font-weight: 600;
      margin-top: 8px;
      padding: 15px;
      border-radius: 10px;
      background: rgba(255, 42, 109, 0.08);
      border: 1px solid rgba(255, 42, 109, 0.2);
      animation: errorShake 0.4s ease;
    }

    @keyframes errorShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      padding-top: 15px;
      border-top: 1px solid rgba(0, 242, 254, 0.15);
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    footer a:hover {
      color: var(--secondary);
      text-shadow: 0 0 6px rgba(255, 42, 109, 0.3);
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .container {
        padding: 20px;
        max-width: 340px;
      }
      
      .header-content h1 {
        font-size: 22px;
      }
      
      .result-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      
      .result-value {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="cosmic-bg"></div>
  <div class="nebula">
    <div class="nebula-cloud"></div>
    <div class="nebula-cloud"></div>
  </div>
  <div class="quantum-particles" id="quantumParticles"></div>
  <div class="holographic-grid"></div>

  <div class="container">
    <div class="header">
      <div class="logo-container">
        <div class="logo-glow"></div>
        <img src="https://i.postimg.cc/1zkqjC1k/mrtan.png" alt="Previous Date Count">
      </div>
      <div class="header-content">
        <h1>Previous Date Count</h1>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">
        <span class="material-icons">calendar_today</span>
        Enter Date (DD-MM-YYYY)
      </label>
      <div class="input-container">
        <input type="text" id="dateInput" class="input-field" placeholder="e.g. 19-10-1890">
        <span class="material-icons input-icon">event</span>
      </div>
      <div class="hint">Format: DD-MM-YYYY (e.g., 25-12-2023)</div>
    </div>
    
    <div class="input-group">
      <label class="input-label">
        <span class="material-icons">arrow_back</span>
        Days to go back
      </label>
      <div class="input-container">
        <input type="number" id="daysBack" class="input-field" placeholder="e.g. 8" min="1">
        <span class="material-icons input-icon">schedule</span>
      </div>
      <div class="hint">Enter a positive number</div>
    </div>

    <button class="calculate-btn" onclick="calculateDate()">
      <span class="material-icons" style="vertical-align: middle; margin-right: 6px;">calculate</span>
      Calculate
    </button>

    <div id="result"></div>

    <footer>
      Developed with ❤️ by <a href="https://github.com/mrtan-official" target="_blank">Abu Tanim</a>
    </footer>
  </div>

  <script>
    // Create quantum particles
    function createQuantumParticles() {
      const container = document.getElementById('quantumParticles');
      const particleCount = 25;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'quantum-particle';
        
        const startX = Math.random() * 100;
        const startY = Math.random() * 100;
        const endX = startX + (Math.random() - 0.5) * 20;
        const endY = startY + (Math.random() - 0.5) * 20;
        
        particle.style.setProperty('--startX', `${startX}vw`);
        particle.style.setProperty('--startY', `${startY}vh`);
        particle.style.setProperty('--endX', `${endX}vw`);
        particle.style.setProperty('--endY', `${endY}vh`);
        particle.style.animationDelay = `${Math.random() * 6}s`;
        
        container.appendChild(particle);
      }
    }

    function calculateDate() {
      const dateStr = document.getElementById('dateInput').value.trim();
      const daysBack = parseInt(document.getElementById('daysBack').value);
      const resultBox = document.getElementById('result');

      // Clear previous result
      resultBox.classList.remove('show');
      
      // Add calculating animation
      document.querySelector('.container').style.transform = 'scale(0.98)';
      setTimeout(() => {
        document.querySelector('.container').style.transform = '';
      }, 200);

      // Validate inputs
      if (!dateStr || isNaN(daysBack) || daysBack < 1) {
        setTimeout(() => {
          resultBox.innerHTML = `
            <div class='error'>
              <span class="material-icons" style="vertical-align: middle; margin-right: 6px;">error</span>
              Please enter a valid date and days value.
            </div>`;
          resultBox.classList.add('show');
        }, 200);
        return;
      }

      const datePattern = /^(\d{1,2})-(\d{1,2})-(\d{4})$/;
      const match = dateStr.match(datePattern);

      if (!match) {
        setTimeout(() => {
          resultBox.innerHTML = `
            <div class='error'>
              <span class="material-icons" style="vertical-align: middle; margin-right: 6px;">warning</span>
              Invalid format! Use DD-MM-YYYY (e.g., 25-12-2023)
            </div>`;
          resultBox.classList.add('show');
        }, 200);
        return;
      }

      const day = parseInt(match[1]);
      const month = parseInt(match[2]);
      const year = parseInt(match[3]);

      // Validate date components
      if (day < 1 || day > 31 || month < 1 || month > 12 || year < 1000 || year > 9999) {
        setTimeout(() => {
          resultBox.innerHTML = `
            <div class='error'>
              <span class="material-icons" style="vertical-align: middle; margin-right: 6px;">block</span>
              Invalid date values! Check day, month, and year.
            </div>`;
          resultBox.classList.add('show');
        }, 200);
        return;
      }

      const inputDate = new Date(year, month - 1, day);

      // Check if the date is valid
      if (inputDate.getDate() !== day || inputDate.getMonth() !== month - 1 || inputDate.getFullYear() !== year) {
        setTimeout(() => {
          resultBox.innerHTML = `
            <div class='error'>
              <span class="material-icons" style="vertical-align: middle; margin-right: 6px;">cancel</span>
              Invalid date! Please verify your values.
            </div>`;
          resultBox.classList.add('show');
        }, 200);
        return;
      }

      // Calculate the previous date
      inputDate.setDate(inputDate.getDate() - daysBack);

      const newDay = inputDate.getDate();
      const newMonth = inputDate.getMonth() + 1;
      const newYear = inputDate.getFullYear();
      
      // Format the date to always show two digits for day and month
      const formattedDay = newDay < 10 ? '0' + newDay : newDay;
      const formattedMonth = newMonth < 10 ? '0' + newMonth : newMonth;
      const fullDate = `${formattedDay}-${formattedMonth}-${newYear}`;

      setTimeout(() => {
        resultBox.innerHTML = `
          <div class="result-title">
            <span class="material-icons">emoji_objects</span>
            CALCULATED DATE
          </div>
          <div class="final-date">
            Previous date: ${fullDate}
          </div>
        `;
        resultBox.classList.add('show');
      }, 400);
    }

    // Add event listeners for Enter key
    document.getElementById('dateInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        calculateDate();
      }
    });

    document.getElementById('daysBack').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        calculateDate();
      }
    });

    // Initialize when page loads
    window.onload = function() {
      createQuantumParticles();
      document.getElementById('dateInput').focus();
    };
  </script>
</body>
</html>
