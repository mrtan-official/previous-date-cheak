<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Tan | Death Cyber Army</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #000010 0%, #000 100%);
      color: #00fff2;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
    }

    /* Background animation */
    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 20%, rgba(0,255,247,0.15), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(255,0,120,0.15), transparent 60%);
      animation: moveBackground 10s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes moveBackground {
      0% { background-position: 0% 0%, 100% 100%; }
      100% { background-position: 100% 100%, 0% 0%; }
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      flex-direction: column;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 2.5em;
      color: #00fff2;
      text-shadow: 0 0 20px #00fff7, 0 0 40px #00ffe1;
      animation: glowText 2.5s ease-in-out infinite alternate;
    }

    @keyframes glowText {
      from { text-shadow: 0 0 15px #00fff7; }
      to { text-shadow: 0 0 35px #00ffe1; }
    }

    .title img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(0,255,255,0.5);
      box-shadow: 0 0 25px rgba(0,255,255,0.4);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .title img:hover {
      transform: scale(1.08);
      box-shadow: 0 0 40px rgba(0,255,255,0.7);
    }

    h2 {
      font-size: 1.2em;
      color: #bbb;
      text-shadow: 0 0 10px #00ffe1;
      margin-top: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <header>
    <div class="title">
      <img src="https://i.postimg.cc/1zkqjC1k/mrtan.png" alt="Mr. Tan Logo">
      <span>💀 MR. TAN 💀</span>
    </div>
    <h2>Cyber Developer • Death Cyber Army</h2>
  </header>
</body>
</html>
