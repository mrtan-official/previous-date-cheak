<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Previous Date count Tool</title>
  <style>
    :root {
      font-family: 'Poppins', Arial, sans-serif;
    }

    body {
      background: #000;
      color: #0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 247, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(0, 255, 255, 0.08) 0%, transparent 50%);
      animation: bgMove 20s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes bgMove {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg);
      }
      33% {
        transform: translate(-50px, -50px) rotate(120deg);
      }
      66% {
        transform: translate(50px, 50px) rotate(240deg);
      }
    }

    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 15s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(50px, 50px);
      }
    }

    .container {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #0ff;
      box-shadow: 0 0 15px #0ff;
      width: 100%;
      max-width: 600px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    h2 {
      color: #00fff7;
      font-size: 22px;
      text-shadow: 0 0 10px #00fff7;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      text-align: left;
      color: #0ff;
    }

    input[type=text], input[type=number] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #00fff7;
      background: #000;
      color: #0ff;
      font-size: 15px;
      margin-bottom: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      box-shadow: 0 0 12px #00fff7, 0 0 6px #00fff7;
    }

    button {
      background: #00fff7;
      color: #000;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
    }

    button:hover {
      background: #0ff;
      box-shadow: 0 0 20px #00fff7;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button.clicked {
      animation: buttonPulse 0.6s ease;
    }

    @keyframes buttonPulse {
      0%, 100% {
        box-shadow: 0 0 10px #00fff7;
      }
      50% {
        box-shadow: 0 0 30px #00fff7, 0 0 50px #00fff7;
        transform: scale(1.05);
      }
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      background: #0a0a0a;
      border: 1px solid #00fff7;
      box-shadow: 0 0 10px #00fff7;
      font-size: 17px;
      color: #fff;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
    }

    #result.show {
      opacity: 1;
      transform: translateY(0);
    }

    .highlight {
      color: #0ff;
      font-weight: bold;
    }

    .error {
      color: #ff4444;
      font-weight: bold;
      margin-top: 10px;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    footer {
      margin-top: 20px;
      font-size: 13px;
      color: #fff;
      text-align: center;
    }

    footer strong {
      color: #ff0;
      text-shadow: 0 0 5px #ff0;
    }

    @keyframes rotateBorder {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes borderPulse {
      0%, 100% {
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
      }
      50% {
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 30px rgba(255, 0, 255, 0.4);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Previous Date count Tool</h2>

    <label for="dateInput">📅 Enter Date (DD-MM-YYYY):</label>
    <input type="text" id="dateInput" placeholder="e.g. 19-10-1890">

    <label for="daysBack">⏪ Days to go back:</label>
    <input type="number" id="daysBack" placeholder="e.g. 8">

    <button id="calcBtn" onclick="calculateDate()">Calculate</button>

    <div id="result"></div>

    <footer>
      <div style="display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap;">
        <div style="position: relative;">
          <div style="width: 50px; height: 50px; border-radius: 50%; background: conic-gradient(from 0deg, #00fff7, #ff00ff, #00ff88, #00fff7); animation: rotateBorder 4s linear infinite; padding: 2px;">
            <div style="width: 100%; height: 100%; border-radius: 50%; background: #111; display: flex; justify-content: center; align-items: center; overflow: hidden;">
              <img src="https://i.postimg.cc/X7H4Dr5Z/1000009494.webp" alt="Developer" style="width: 46px; height: 46px; border-radius: 50%; object-fit: cover;">
            </div>
          </div>
        </div>
        <div style="text-align: left;">
          <div style="color: #00fff7; font-weight: bold; font-size: 14px; text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);">Abu Tanim</div>
          <div style="color: #888; font-size: 11px; margin-top: 2px;">✨Developer & Designer</div>
          <div style="margin-top: 5px;">
            <a href="https://github.com/mrtan-official" target="_blank" style="color:#0078ff; text-decoration:none; font-weight:bold; font-size: 12px;">
              🐙 GitHub: Mr Tan
            </a>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script>
    function calculateDate() {
      const dateStr = document.getElementById('dateInput').value.trim();
      const daysBack = parseInt(document.getElementById('daysBack').value);
      const resultBox = document.getElementById('result');
      const button = document.getElementById('calcBtn');

      const datePattern = /^(\d{1,2})-(\d{1,2})-(\d{4})$/;
      const match = dateStr.match(datePattern);

      if (!match || isNaN(daysBack)) {
        resultBox.innerHTML = `<div class='error'>⚠️ Invalid input! Please enter date in DD-MM-YYYY format and a valid number of days.</div>`;
        resultBox.classList.add('show');
        return;
      }

      const day = parseInt(match[1]);
      const month = parseInt(match[2]);
      const year = parseInt(match[3]);

      const inputDate = new Date(year, month - 1, day);

      // Validate correct date
      if (
        inputDate.getDate() !== day ||
        inputDate.getMonth() !== month - 1 ||
        inputDate.getFullYear() !== year
      ) {
        resultBox.innerHTML = `<div class='error'>❌ Invalid date detected! Please verify your day, month, and year values are correct.</div>`;
        resultBox.classList.add('show');
        return;
      }

      inputDate.setDate(inputDate.getDate() - daysBack);

      const newDay = inputDate.getDate();
      const newMonth = inputDate.getMonth() + 1;
      const newYear = inputDate.getFullYear();

      // Button glow
      button.classList.add("clicked");
      setTimeout(() => {
        button.classList.remove("clicked");
      }, 600);

      resultBox.innerHTML = `
        <div><span class="highlight">🕒 New Date:</span></div>
        <div><span class="highlight">Day:</span> ${newDay}</div>
        <div><span class="highlight">Month:</span> ${newMonth}</div>
        <div><span class="highlight">Year:</span> ${newYear}</div>
      `;
      
      resultBox.classList.add('show');
    }
  </script>
</body>
</html>
