<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Previous Date Count Tool | Mr. Tan</title>
  
  <!-- Favicon -->
  <link rel="icon" href="https://i.postimg.cc/1zkqjC1k/mrtan.png" type="image/png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background-image:
        linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: translate(0,0); }
      100% { transform: translate(40px,40px); }
    }

    .container {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #0ff;
      box-shadow: 0 0 15px #0ff;
      width: 100%;
      max-width: 600px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .header img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(0,255,247,0.5);
      box-shadow: 0 0 15px #00fff7;
    }

    .header h2 {
      font-size: 24px;
      color: #00fff7;
      text-shadow: 0 0 10px #00fff7;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      text-align: left;
      color: #0ff;
    }

    input[type=text], input[type=number] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #00fff7;
      background: #000;
      color: #0ff;
      font-size: 15px;
      margin-bottom: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      box-shadow: 0 0 12px #00fff7, 0 0 6px #00fff7;
    }

    button {
      background: #00fff7;
      color: #000;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      background: #0ff;
      box-shadow: 0 0 20px #00fff7;
      transform: translateY(-2px);
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      background: #0a0a0a;
      border: 1px solid #00fff7;
      box-shadow: 0 0 10px #00fff7;
      font-size: 17px;
      color: #fff;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
    }

    #result.show {
      opacity: 1;
      transform: translateY(0);
    }

    .highlight {
      color: #0ff;
      font-weight: bold;
    }

    .error {
      color: #ff4444;
      font-weight: bold;
      margin-top: 10px;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    footer {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }

    footer a {
      color: #00fff7;
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header + Image -->
    <div class="header">
      <img src="https://i.postimg.cc/1zkqjC1k/mrtan.png" alt="Mr. Tan">
      <h2>Previous Date Count Tool</h2>
    </div>

    <label for="dateInput">📅 Enter Date (DD-MM-YYYY):</label>
    <input type="text" id="dateInput" placeholder="e.g. 19-10-1890">

    <label for="daysBack">⏪ Days to go back:</label>
    <input type="number" id="daysBack" placeholder="e.g. 8">

    <button id="calcBtn" onclick="calculateDate()">Calculate</button>

    <div id="result"></div>

    <footer>
      Developed by <a href="https://github.com/mrtan-official" target="_blank">Abu Tanim</a>
    </footer>

  </div>

  <script>
    function calculateDate() {
      const dateStr = document.getElementById('dateInput').value.trim();
      const daysBack = parseInt(document.getElementById('daysBack').value);
      const resultBox = document.getElementById('result');

      const datePattern = /^(\d{1,2})-(\d{1,2})-(\d{4})$/;
      const match = dateStr.match(datePattern);

      if (!match || isNaN(daysBack)) {
        resultBox.innerHTML = `<div class='error'>⚠️ Invalid input! Please enter date in DD-MM-YYYY format and a valid number of days.</div>`;
        resultBox.classList.add('show');
        return;
      }

      const day = parseInt(match[1]);
      const month = parseInt(match[2]);
      const year = parseInt(match[3]);

      const inputDate = new Date(year, month - 1, day);

      if (inputDate.getDate() !== day || inputDate.getMonth() !== month - 1 || inputDate.getFullYear() !== year) {
        resultBox.innerHTML = `<div class='error'>❌ Invalid date detected! Please verify your day, month, and year values are correct.</div>`;
        resultBox.classList.add('show');
        return;
      }

      inputDate.setDate(inputDate.getDate() - daysBack);

      const newDay = inputDate.getDate();
      const newMonth = inputDate.getMonth() + 1;
      const newYear = inputDate.getFullYear();

      resultBox.innerHTML = `
        <div><span class="highlight">🕒 New Date:</span></div>
        <div><span class="highlight">Day:</span> ${newDay}</div>
        <div><span class="highlight">Month:</span> ${newMonth}</div>
        <div><span class="highlight">Year:</span> ${newYear}</div>
      `;
      
      resultBox.classList.add('show');
    }
  </script>
</body>
</html>
